name: Build and Release ESP32 Firmware

on:
  push:
    branches: [main, m1-stt-pipeline]
    paths:
      - '.github/workflows/build.yml'
      - 'src/**'
      - 'platformio.ini'
      - 'partitions_ota.csv'
      - 'version.txt'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build.yml'
      - 'src/**'
      - 'platformio.ini'
      - 'partitions_ota.csv'
      - 'version.txt'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-${{ hashFiles('**/platformio.ini') }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set firmware version
        run: |
          RAW_VERSION=$(cat version.txt | tr -d ' \t\n\r')
          VERSION=${RAW_VERSION#v}
          VER=v$VERSION
          echo "VERSION=$VER" >> $GITHUB_ENV
          echo "Firmware version: $VER"

      - name: Install PlatformIO Core
        run: pip install platformio

      - name: Build firmware
        run: pio run

      - name: Upload .bin as artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-bin
          path: .pio/build/esp32-c3-supermini/firmware.bin

      - name: Get commit message
        id: commit_msg
        run: echo "body<<EOF" >> $GITHUB_OUTPUT && git log -1 --format='%B' >> $GITHUB_OUTPUT && echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: ${{ env.VERSION }}
          body: ${{ steps.commit_msg.outputs.body }}
          files: .pio/build/esp32-c3-supermini/firmware.bin
          fail_on_unmatched_files: false
          make_latest: true
